<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
    <title>UniForge · 总览</title>
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <div id="app-shell" class="app-shell">
      <aside class="sidebar" aria-label="主导航">
        <div class="brand"><span class="brand-mark">U</span><span>UniForge</span></div>
        <nav id="primary-navigation" class="primary-navigation" aria-label="主导航"></nav>
      </aside>
      <main class="main-content" aria-live="polite">
        <header class="topbar">
          <span class="eyebrow">工作台</span
          ><span id="connection-state" class="status">本地运行</span>
        </header>
        <section class="content-card">
          <p class="eyebrow">当前模块</p>
          <h1>UniForge</h1>
          <p id="module-description">正在加载工作台…</p>
        </section>
        <section class="dashboard" aria-labelledby="dashboard-title">
          <div class="dashboard-heading">
            <div>
              <p class="eyebrow">今日工作台</p>
              <h2 id="dashboard-title">概览</h2>
            </div>
            <span id="dashboard-workspace-state" class="status">正在加载…</span>
          </div>
          <div id="dashboard-items" class="dashboard-grid" aria-live="polite">
            <p class="dashboard-placeholder">正在加载概览…</p>
          </div>
        </section>
        <section class="settings-card" aria-labelledby="settings-title">
          <p class="eyebrow">设置中心</p>
          <h2 id="settings-title">运行状态</h2>
          <div id="settings-summary">正在加载设置…</div>
        </section>
        <section id="course-page" class="settings-card" aria-labelledby="course-title">
          <p class="eyebrow">课内学习</p>
          <h2 id="course-title">课程入口</h2>
          <p id="course-state">正在加载课程状态…</p>
          <p id="course-material-state">课程资料尚未导入。</p>
          <form id="course-form">
            <input id="course-name" required placeholder="课程名称" aria-label="课程名称" />
            <input id="course-term" required placeholder="学期" aria-label="学期" />
            <button type="submit">创建课程</button>
          </form>
          <p id="course-error" role="alert"></p>
          <button id="course-material-import" type="button">导入课程资料</button>
          <p id="course-material-error" role="alert"></p>
          <p id="course-recognition-state">
            尚未产生识别提案。导入资料后，识别结果将在用户确认前显示证据。
          </p>
        </section>
      </main>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
