<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
    <title>UniForge · 总览</title>
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <div id="app-shell" class="app-shell">
      <aside class="sidebar" aria-label="主导航">
        <div class="brand"><span class="brand-mark">U</span><span>UniForge</span></div>
        <nav id="primary-navigation" class="primary-navigation" aria-label="主导航"></nav>
      </aside>
      <main class="main-content" aria-live="polite">
        <header class="topbar">
          <span class="eyebrow">工作台</span
          ><span id="connection-state" class="status">本地运行</span>
        </header>
        <section class="content-card">
          <p class="eyebrow">当前模块</p>
          <h1>UniForge</h1>
          <p id="module-description">正在加载工作台…</p>
        </section>
        <section class="dashboard" aria-labelledby="dashboard-title">
          <div class="dashboard-heading">
            <div>
              <p class="eyebrow">今日工作台</p>
              <h2 id="dashboard-title">概览</h2>
            </div>
            <span id="dashboard-workspace-state" class="status">正在加载…</span>
          </div>
          <div id="dashboard-items" class="dashboard-grid" aria-live="polite">
            <p class="dashboard-placeholder">正在加载概览…</p>
          </div>
        </section>
        <section class="settings-card" aria-labelledby="settings-title">
          <p class="eyebrow">设置中心</p>
          <h2 id="settings-title">运行状态</h2>
          <div id="settings-summary">正在加载设置…</div>
        </section>
        <section id="course-page" class="settings-card" aria-labelledby="course-title">
          <p class="eyebrow">课内学习</p>
          <h2 id="course-title">课程入口</h2>
          <p id="course-state">正在加载课程状态…</p>
          <p id="course-material-state">课程资料尚未导入。</p>
          <form id="course-form">
            <input id="course-name" required placeholder="课程名称" aria-label="课程名称" />
            <input id="course-term" required placeholder="学期" aria-label="学期" />
            <button type="submit">创建课程</button>
          </form>
          <p id="course-error" role="alert"></p>
          <button id="course-material-import" type="button">导入课程资料</button>
          <p id="course-material-error" role="alert"></p>
          <p id="course-recognition-state">
            尚未产生识别提案。导入资料后，识别结果将在用户确认前显示证据。
          </p>
          <div id="course-ai" aria-labelledby="course-ai-title">
            <h3 id="course-ai-title">Course AI</h3>
            <form id="course-ai-form">
              <input
                id="course-ai-question"
                required
                placeholder="向课程 AI 提问"
                aria-label="向课程 AI 提问"
              />
              <button type="submit">提问</button>
            </form>
            <p id="course-ai-state">Course AI 尚未运行。</p>
            <p id="course-ai-error" role="alert"></p>
          </div>
          <div id="assignment-modes" aria-labelledby="assignment-modes-title">
            <h3 id="assignment-modes-title">作业模式</h3>
            <form id="assignment-form">
              <select id="assignment-mode" aria-label="作业模式">
                <option value="COLLABORATION">协作模式（默认）</option>
                <option value="TUTORING">辅导模式</option>
                <option value="TASK_EXECUTION">任务执行模式（需审批）</option>
              </select>
              <input id="assignment-prompt" required placeholder="作业目标" aria-label="作业目标" />
              <button type="submit">开始作业</button>
            </form>
            <p id="assignment-state">作业模式尚未启动。</p>
            <p id="assignment-error" role="alert"></p>
          </div>
          <div id="course-execution" aria-labelledby="course-execution-title">
            <h3 id="course-execution-title">课程代码执行</h3>
            <form id="execution-form">
              <input
                id="execution-workspace"
                required
                placeholder="授权临时工作区"
                aria-label="授权临时工作区"
              />
              <input
                id="execution-entrypoint"
                required
                value="main.py"
                placeholder="入口文件"
                aria-label="入口文件"
              />
              <select id="execution-operation" aria-label="执行操作">
                <option value="COMPILE">编译</option>
                <option value="RUN">运行</option>
                <option value="TEST">测试</option>
                <option value="DEBUG">调试</option>
              </select>
              <input
                id="execution-command"
                required
                value="python main.py"
                placeholder="受控命令"
                aria-label="受控命令"
              />
              <button type="submit">执行</button>
            </form>
            <p id="execution-state">代码执行尚未运行。</p>
          </div>
        </section>
      </main>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
