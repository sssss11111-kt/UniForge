name: stage-0
on:
  push:
    branches: [master, 'codex/**']
  pull_request:
jobs:
  baseline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: '.node-version', cache: npm }
      - run: npm ci
      - run: npm run check-baseline
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run unit
